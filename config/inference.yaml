  agent_server_url: http://localhost:30000    # Phi-4-mini (base or merged, per variant)
  judge_server_url: http://localhost:30001    # Llama-3.1-8B-Instruct
  temperature: 0.0
  max_tokens: 8
  timeout_s: 30
  max_concurrency: 16     # concurrent in-flight requests per client (tune to GPU headroom)

  # --- server launch parameters (consumed by scripts/launch_sglang_servers.sh) ---
  # NOTE: changed to ABSOLUTE paths (/workspace/models/...) - the previous relative
  # paths (models/phi-4-mini-hf) resolve against whatever the CURRENT WORKING
  # DIRECTORY happens to be when a script reads this config, not the repo root. This
  # was fragile even before tonight (this session hit real cd/pwd confusion more than
  # once), and became load-bearing rather than just launch-script metadata once the
  # chat-template fix started reading these same keys via
  # AutoTokenizer.from_pretrained() in src/inference/sglang_server.py,
  # src/sbso/judge.py, and src/sbso/dspy_compiler.py - a relative-path failure there
  # would be a hard crash, not a silent launch-script quirk. VERIFY these paths are
  # actually correct on your pod before trusting this file - see the ls commands
  # Claude gave alongside this fix.
  
  launch:
    agent_model_path: /workspace/models/phi-4-mini-hf
    agent_port: 30000
    agent_mem_fraction_static: 0.45
    judge_model_path: /workspace/models/llama-3.1-8b-instruct-hf
    judge_port: 30001
    judge_mem_fraction_static: 0.45
    host: 0.0.0.0
    startup_timeout_s: 300
    agent_port: 30000
    agent_mem_fraction_static: 0.45
    judge_model_path: models/llama-3.1-8b-instruct-hf
