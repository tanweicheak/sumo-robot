# Hardware Constraint Monitor Agent (HCMA) policy.
# Implements plan Section 6.5 recommended default: token-budget governor (continuous)
# + emergency SA-bypass circuit-breaker (last resort). Report.md Sections 3.3.2.1 / 3.3.3.4.

decision_window_ms: 50

token_budget_governor:
  enabled: true
  # max_new_tokens per agent, scaled down as HEL headroom shrinks.
  base_max_new_tokens:
    oaa: 256
    sa: 192
    tea: 128
  # hard floor so TEA's cap never drops below a schema-completable length.
  min_max_new_tokens:
    oaa: 96
    sa: 64
    tea: 64
  headroom_scaling:
    # headroom_ratio = remaining_budget_ms / decision_window_ms
    full_budget_above_ratio: 0.6    # >=60% headroom -> use base_max_new_tokens
    tighten_below_ratio: 0.3         # <30% headroom -> scale toward min_max_new_tokens

emergency_bypass:
  enabled: true
  # if consumed budget exceeds this fraction of decision_window_ms before SA is called,
  # skip SA and route OAA output directly into TEA (reuses the No-SA ablation data path,
  # plan Assumption A3). Must be logged distinctly from true No-SA ablation runs.
  trigger_consumed_ratio: 0.9

# Deferred (plan Section 6.5, Options 1/3/5 - not enabled in the Phase 0 default):
tiered_prompt_templates:
  enabled: false
context_truncation:
  enabled: false
kv_cache_prefix_reuse:
  enabled: false   # effectively free once SGLang is wired up in Phase 3
