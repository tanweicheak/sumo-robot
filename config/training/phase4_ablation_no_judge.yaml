# Ablation 5b.4: Benchmark 2 with LLM-as-a-Judge removed.
variant_name: ablation_no_judge
extends: _shared_defaults.yaml

ablation:
  strategy: no_judge
  # Branches go unfiltered into simulation: full compute budget, no pruning.

components:
  mcts: enabled
  llm_as_a_judge: disabled
  dspy: enabled

checkpoint_output_dir: checkpoints/ablation_no_judge/

episodes_total: 500
self_checkpoint_interval_episodes: 25
dspy_recompilation:
  k_rollout_batches: 25
opponent_pool:
  warmup_episodes: 100
  warmup_split:
    baseline1: 50
    baseline2: 50
  full_run_targets:
    baseline1: 184
    baseline2: 183
    self_checkpoint: 133

# --- mcts override (fix, added after cancelling the Benchmark 2 first attempt) ------
# See phase4_full_sbso.yaml for full rationale. MCTS stays enabled in this ablation
# (only the Judge is disabled), so sim_budget still applies - simulations still run,
# they just aren't pruned by judge_prune_threshold (run_phase4_pilot.py's own code
# already forces that to 0.0 for this ablation regardless of the value set here, per
# the "no_judge ablation: force 0.0 regardless of config" comment seen earlier this
# session - left at the real default below rather than 0.0, since this key has no
# effect for this variant either way).
mcts:
  sim_budget: 20
  horizon: 3
  judge_prune_threshold: 0.3
  decision_cycles: 6
  max_decisions_per_match: 50