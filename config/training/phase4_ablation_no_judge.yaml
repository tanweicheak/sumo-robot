# Ablation 5b.4: Benchmark 2 with LLM-as-a-Judge removed.
variant_name: ablation_no_judge
extends: _shared_defaults.yaml

ablation:
  strategy: no_judge
  # Branches go unfiltered into simulation: full compute budget, no pruning.

components:
  mcts: enabled
  llm_as_a_judge: disabled
  dspy: enabled

checkpoint_output_dir: checkpoints/ablation_no_judge/

episodes_total: 500
self_checkpoint_interval_episodes: 25
dspy_recompilation:
  k_rollout_batches: 25
opponent_pool:
  warmup_episodes: 100
  warmup_split:
    baseline1: 50
    baseline2: 50
  full_run_targets:
    baseline1: 184
    baseline2: 183
    self_checkpoint: 133