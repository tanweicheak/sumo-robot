# Ablation 5b.2: Benchmark 2 with MCTS removed.
variant_name: ablation_no_mcts
extends: _shared_defaults.yaml

ablation:
  strategy: no_mcts
  # Replaced by single-pass direct policy sampling: one rollout per decision point,
  # no Selection/Expansion/Backprop, no tree statistics. See plan Assumption A3.

components:
  mcts: disabled
  llm_as_a_judge: enabled
  dspy: enabled

checkpoint_output_dir: checkpoints/ablation_no_mcts/

episodes_total: 500
self_checkpoint_interval_episodes: 25
dspy_recompilation:
  k_rollout_batches: 25
opponent_pool:
  warmup_episodes: 100
  warmup_split:
    baseline1: 50
    baseline2: 50
  full_run_targets:
    baseline1: 184
    baseline2: 183
    self_checkpoint: 133