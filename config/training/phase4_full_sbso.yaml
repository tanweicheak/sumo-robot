# Benchmark 2: Multi-Agent Full SBSO Model.
variant_name: benchmark2_full_sbso
extends: _shared_defaults.yaml

ablation:
  strategy: none   # full pipeline: MCTS + LLM-as-a-Judge + DSPy + LoRA

components:
  mcts: enabled
  llm_as_a_judge: enabled
  dspy: enabled

checkpoint_output_dir: checkpoints/benchmark2_full_sbso/

episodes_total: 500
self_checkpoint_interval_episodes: 25
dspy_recompilation:
  k_rollout_batches: 25
opponent_pool:
  warmup_episodes: 100
  warmup_split:
    baseline1: 50
    baseline2: 50
  full_run_targets:
    baseline1: 184
    baseline2: 183
    self_checkpoint: 133

# --- mcts override (fix, added after cancelling the first attempt) ------------------
# _shared_defaults.yaml's mcts.sim_budget: 40 is explicitly marked "PLACEHOLDER -
# never calibrated" - never a deliberate choice, just an unreviewed carryover. The
# only sim_budget with real calibration evidence is 20 (phase4_pilot.yaml's value,
# backed by an actual report_mcts_judge_calibration.py run: r=0.25, weak-but-real
# signal). Using 40 doubled real per-decision time on the first attempt (judge calls
# are the dominant, roughly sim_budget-linear cost) for a value with zero supporting
# evidence. Overriding to the evidenced value.
mcts:
  sim_budget: 20
  horizon: 3
  judge_prune_threshold: 0.3
  decision_cycles: 6
  max_decisions_per_match: 50