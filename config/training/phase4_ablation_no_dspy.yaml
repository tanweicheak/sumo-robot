# Ablation 5b.3: Benchmark 2 with DSPy removed.
variant_name: ablation_no_dspy
extends: _shared_defaults.yaml

ablation:
  strategy: no_dspy
  # Prompt program frozen at its initial hand-authored state for the entire run;
  # LoRA SFT still trains on whatever trajectories the static prompt collects.
  # See plan Assumption A3.

components:
  mcts: enabled
  llm_as_a_judge: enabled
  dspy: disabled

checkpoint_output_dir: checkpoints/ablation_no_dspy/

episodes_total: 500
self_checkpoint_interval_episodes: 25
dspy_recompilation:
  k_rollout_batches: 25
opponent_pool:
  warmup_episodes: 100
  warmup_split:
    baseline1: 50
    baseline2: 50
  full_run_targets:
    baseline1: 184
    baseline2: 183
    self_checkpoint: 133

# --- mcts override (fix, added after cancelling the Benchmark 2 first attempt) ------
# See phase4_full_sbso.yaml for full rationale. MCTS stays enabled in this ablation
# (only DSPy is disabled), so this fix fully applies here.
mcts:
  sim_budget: 20
  horizon: 3
  judge_prune_threshold: 0.3
  decision_cycles: 6
  max_decisions_per_match: 50