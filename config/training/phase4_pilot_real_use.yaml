variant_name: benchmark2_pilot
extends: _shared_defaults.yaml

episodes_total: 500                       # override: pilot scope, not the full 5000
self_checkpoint_interval_episodes: 100    # smaller so you see checkpointing fire a few times

mcts:
  sim_budget: 20      # smaller than full-run's likely 30-50, for pilot speed
  horizon: 3
  judge_prune_threshold: 0.3
  decision_cycles: 6              # physical control cycles executed per macro-decision
  # TEMPORARY diagnostic bump from 50 - every episode in the prior pilot run hit the
  # 50-decision ceiling with ZERO real win/loss/draw resolutions (confirmed: all 850
  # logged decisions showed match_outcome="draw", decision_index maxing at 49 on
  # every single episode with zero variance). Testing whether matches simply need
  # more simulated time to resolve naturally, before assuming a deeper behavioral or
  # physics problem. Revert to 50 (or whatever value real testing settles on) once
  # this is understood - do not leave at 90 for a real training run without
  # confirming this is the right number, not just "big enough to make the symptom
  # go away."
  max_decisions_per_match: 50

dspy_recompilation:
  k_rollout_batches: 100    # override _shared_defaults' 500, so DSPy visibly fires ~5x in the pilot
  reward_drop_threshold_delta: 0.05
  rolling_window_w: 50

opponent_pool:
  pilot_scope: [baseline1, baseline2]   # self_checkpoint EXCLUDED for pilot (see header note)

ablation:
  strategy: none

components:
  mcts: enabled
  llm_as_a_judge: enabled
  dspy: enabled

checkpoint_output_dir: checkpoints/benchmark2_pilot/

cost_projection:
  full_episodes_per_variant: 5000
  num_variants: 5
  gpu_rate_usd_per_hr: 1    # update to your actual RunPod rate before running